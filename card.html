<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>林小黑 · AI 修复师 · 电子名片</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; min-height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: linear-gradient(160deg, #1a2b3c 0%, #243b52 55%, #2c4a66 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 28px 20px; min-height: 100vh;
    color: #2c3a46;
  }
  .card {
    width: 100%; max-width: 400px;
    background: #fdfdfb;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    padding: 40px 30px 32px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, #1f6f5c, #2f8f7a, #1f6f5c);
  }
  .name { font-size: 34px; font-weight: 700; letter-spacing: 2px; color: #1a1f24; }
  .en { font-size: 14px; color: #8a959e; letter-spacing: 1px; margin-top: 4px; }
  .title {
    display: inline-block; margin-top: 18px; padding: 7px 14px;
    background: #eef4f2; color: #1f6f5c; border-radius: 20px;
    font-size: 15px; font-weight: 600; letter-spacing: 1px;
  }
  .verify {
    display: inline-block; margin-top: 10px; margin-left: 6px;
    padding: 4px 10px;
    background: #fdf0e7; color: #c96a1f; border-radius: 14px;
    font-size: 12px; font-weight: 700; letter-spacing: 1px;
  }
  .tagline { margin-top: 20px; font-size: 15px; color: #4a5560; line-height: 1.9; }
  .tagline b { color: #c96a1f; font-weight: 600; }
  .divider { height: 1px; background: #ececec; margin: 22px 0; }
  .block { margin-bottom: 14px; }
  .label { font-size: 12px; color: #a0a8ae; letter-spacing: 2px; margin-bottom: 6px; }
  .val { font-size: 15px; color: #3a454e; line-height: 1.7; }
  .links { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  a.link {
    display: flex; align-items: center; justify-content: space-between;
    text-decoration: none; color: #1f6f5c; font-size: 15px; font-weight: 600;
    padding: 13px 16px; border: 1px solid #dde7e3; border-radius: 12px;
    background: #f7faf9;
  }
  a.link .arrow { color: #b7c2c9; font-size: 16px; }
  .contact { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .contact .row { font-size: 14px; color: #4a5560; display: flex; align-items: center; gap: 8px; }
  .contact .row .k { color: #a0a8ae; font-size: 12px; letter-spacing: 1px; min-width: 40px; }
  .contact .row .v { color: #2f3a44; font-weight: 600; }
  .foot { margin-top: 22px; text-align: center; font-size: 12px; color: #b3bcc2; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="card">
    <div class="name">林小黑</div>
    <div class="en">Lin Xiaohei</div>
    <div class="title">AI 修复师 · 架构改造</div>
    <span class="verify">可当场验证</span>

    <p class="tagline">
      把你现在用得<b>别扭</b>的 AI 系统、模型、提示词拿给我——<br>
      当场诊断问题，给出改造方案。
    </p>

    <div class="divider"></div>

    <div class="block">
      <div class="label">方法底座</div>
      <div class="val">结构认知（读结构 · 找缝 · 判层级）——诊断和改造 AI 系统的那套框架。</div>
    </div>

    <div class="links">
      <a class="link" href="https://gitee.com/samforce/structural-cognition">
        <span>Gitee 论文库</span><span class="arrow">→</span>
      </a>
    </div>

    <div class="contact">
      <div class="row"><span class="k">邮箱</span><span class="v">linxiaohei@structural-cognition.org</span></div>
      <div class="row"><span class="k">微信</span><span class="v">samforce2003</span></div>
    </div>

    <div class="foot">AI 修复师 · 2026</div>
  </div>
</body>
</html>
